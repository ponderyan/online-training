name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: |
            client/pnpm-lock.yaml
            server/pnpm-lock.yaml

      - name: Install client deps
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Install server deps
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Build server (tsc)
        working-directory: server
        run: npx tsc --noEmit

      - name: Build client (next build)
        working-directory: client
        run: pnpm build

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: foxlearn_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: |
            client/pnpm-lock.yaml
            server/pnpm-lock.yaml

      - name: Install deps
        run: |
          cd client && pnpm install --frozen-lockfile
          cd ../server && pnpm install --frozen-lockfile

      - name: Setup test database
        working-directory: server
        env:
          DATABASE_URL: mysql://root:root@localhost:3306/foxlearn_test
        run: npx prisma db push --accept-data-loss

      - name: Build server
        working-directory: server
        run: pnpm build

      - name: Start server
        working-directory: server
        env:
          DATABASE_URL: mysql://root:root@localhost:3306/foxlearn_test
          JWT_SECRET: ci-test-secret
          NODE_ENV: test
        run: node dist/main.js &

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/api/health && break
            sleep 1
          done

      - name: Run server API tests (vitest)
        working-directory: server
        run: npx vitest run

      - name: Start client dev server
        working-directory: client
        run: pnpm dev &

      - name: Wait for client
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 > /dev/null && break
            sleep 1
          done

      - name: Install Playwright browsers
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: client
        run: npx playwright test --project=login-permission --project=exam-flow --project=grading-flow

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7
