version: '3.8'

services:
  # ── MySQL 数据库 ──
  db:
    image: mysql:8.0
    container_name: foxlearn-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-foxlearn_root_2026}
      MYSQL_DATABASE: ${DB_NAME:-online_training}
      MYSQL_USER: ${DB_USER:-training_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-training_2024}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # ── NestJS 后端 ──
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: foxlearn-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://${DB_USER:-training_user}:${DB_PASSWORD:-training_2024}@db:3306/${DB_NAME:-online_training}"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SITE_URL: ${SITE_URL:-http://localhost}
      NODE_ENV: production
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Next.js 前端 ──
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${SITE_URL:-http://localhost}
    container_name: foxlearn-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"

  # ── Nginx 反向代理 ──
  nginx:
    image: nginx:alpine
    container_name: foxlearn-nginx
    restart: unless-stopped
    depends_on:
      - client
      - server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - uploads_data:/var/www/uploads:ro

  # ── 一次性 Seed 容器（初始化/重置演示数据，profiles=tools 默认不启动）──
  seed:
    build:
      context: ./server
      dockerfile: Dockerfile.seed
    container_name: foxlearn-seed
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://${DB_USER:-training_user}:${DB_PASSWORD:-training_2024}@db:3306/${DB_NAME:-online_training}"
      DEMO_PASSWORD: ${DEMO_PASSWORD:-foxlearn2026}

volumes:
  mysql_data:
  uploads_data:
